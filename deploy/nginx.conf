server {
    listen 80;
    listen [::]:80;
    server_name 78.157.54.151;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/hireloop-acme;
    }
    location / {
        return 301 https://78.157.54.151$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 78.157.54.151;
    ssl_certificate /etc/hireloop/letsencrypt/live/78.157.54.151/fullchain.pem;
    ssl_certificate_key /etc/hireloop/letsencrypt/live/78.157.54.151/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/hireloop/current/frontend/dist;
    index index.html;
    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~ /\. {
        deny all;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
